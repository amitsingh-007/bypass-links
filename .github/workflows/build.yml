name: Build CI
on:
  push:
    branches-ignore:
      - 'main'
      - 'renovate/**'

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}

      - name: Building
        run: |
          pnpm build
          if grep --recursive --fixed-strings --quiet '__test_auth_data' apps/extension/.output/chrome-mv3; then
            echo 'Test-only sign-in is present in the release build'
            exit 1
          else
            test "$?" -eq 1
          fi

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-file
          path: ./apps/extension/.output/chrome-bypass-links-*.zip
          include-hidden-files: true
