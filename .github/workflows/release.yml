name: Deploy CI
on:
  push:
    branches:
      - 'main'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      preview_url: ${{ steps.build.outputs.preview-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - id: build
        uses: ./.github/actions/build-preview
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          upload-release: 'true'

  Playwright:
    needs: [Build]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/e2e
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          preview-url: ${{ needs.Build.outputs.preview_url }}
          coverage: 'true'

  Deploy:
    runs-on: ubuntu-latest
    needs: [Playwright]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Start deployment
        uses: bobheadxi/deployments@v1.5.0
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: Production

      - name: Deploy (Vercel)
        uses: amondnet/vercel-action@v42
        env:
          NPM_CONFIG_FORCE: 'true'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID}}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID}}
          vercel-args: '--prod'

      - name: Finish deployment
        uses: bobheadxi/deployments@v1.5.0
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: ${{ steps.vercel-action.outputs.preview-url }}
          env: ${{ steps.deployment.outputs.env }}
          # Defaults to true on finish, which walks every existing deployment of
          # the environment and writes a status to each. That hit GitHub's
          # secondary rate limit and failed the job, skipping Create_Release.
          override: false

  Create_Release:
    runs-on: ubuntu-latest
    needs: [Deploy]
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download extension
        uses: actions/download-artifact@v8
        with:
          name: extension-release
          path: ./apps/extension/.output

      - name: Generate Release Tag
        id: release_tag
        uses: amitsingh-007/next-release-tag@v6.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: 'v'
          tag_template: 'yy.mm.i'

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.release_tag.outputs.next_release_tag }}
          tag_name: ${{ steps.release_tag.outputs.next_release_tag }}
          token: ${{secrets.GITHUB_TOKEN}}
          generate_release_notes: true
          files: |
            ./apps/extension/.output/chrome-*.zip

      - name: Purge Vercel Cache
        run: |
          pnpm vercel cache dangerously-delete \
            --tag extensions-release-cache \
            --yes --token=${{ secrets.VERCEL_TOKEN }}
