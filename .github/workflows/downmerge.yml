name: Downmerge Changes
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: downmerge-renovate-updates
  cancel-in-progress: false

jobs:
  Sync:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Downmerge main -> renovate-updates
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.merge({
              ...context.repo,
              base: 'renovate-updates',
              head: 'main',
            });
