name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      vercel_url:
        description: 'Optional Vercel preview URL (skip Vercel deployment if provided)'
        required: false
        type: string
      coverage:
        description: 'Collect V8 coverage during the test run'
        required: false
        default: false
        type: boolean

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      preview_url: ${{ steps.build.outputs.preview-url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - id: build
        uses: ./.github/actions/build-preview
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-url: ${{ inputs.vercel_url }}

  Playwright:
    needs: [Build]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: ./.github/actions/e2e
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          preview-url: ${{ needs.Build.outputs.preview_url }}
          coverage: ${{ inputs.coverage }}
