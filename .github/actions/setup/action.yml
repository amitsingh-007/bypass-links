name: Setup
description: Install pnpm and Node.js, then pull the Vercel preview env into .env
inputs:
  vercel-token:
    description: Vercel token; when set, .env is pulled from the preview environment
    default: ''
runs:
  using: composite
  steps:
    - name: Setup pnpm and Node.js
      uses: pnpm/setup@v2
      with:
        cache: true

    - name: Pull environment variables
      if: inputs.vercel-token != ''
      shell: bash
      run: pnpm vercel env pull .env --yes --environment=preview --token=${{ inputs.vercel-token }}
