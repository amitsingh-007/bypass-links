name: E2E
description: Run the Playwright suite against a preview deployment with the e2e extension artifact
inputs:
  vercel-token:
    description: Vercel token, used to pull .env
    required: true
  preview-url:
    description: Preview URL that the web specs and the extension run against
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
      with:
        vercel-token: ${{ inputs.vercel-token }}

    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: echo "version=$(pnpm playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright binaries
      uses: actions/cache@v6
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: cache-playwright-chromium-${{ steps.playwright-version.outputs.version }}

    - name: Download extension
      uses: actions/download-artifact@v8
      with:
        name: extension-e2e
        path: ./apps/extension/.output/chrome-mv3/

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm playwright install --with-deps chromium

    - name: Run Playwright tests
      shell: bash
      run: pnpm e2e apps/extension/tests/specs/background-navigation.spec.ts --project @bypass/extension --no-deps --grep 'native redirect interception spike'
      env:
        PLAYWRIGHT_TEST_BASE_URL: ${{ inputs.preview-url }}
        COVERAGE: '1'

    - name: Upload Playwright test report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: |
          .playwright/playwright-report/
          .playwright/test-results/
          .playwright/coverage/
        include-hidden-files: true
        if-no-files-found: ignore
